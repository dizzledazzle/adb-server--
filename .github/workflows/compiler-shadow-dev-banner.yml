# Generated by compiler.dev benchmark mode. Runs eligible jobs a second time on
# compiler.dev runners for comparison only: continue-on-error, read-only, never gates merges.
# Remove this file to stop the benchmark.
name: compiler-shadow / Dev banner
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: compiler-shadow-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  banner:
    runs-on: ["self-hosted", "compiler-ci"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Render banner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases" --paginate | python3 scripts/dev_banner.py > "$RUNNER_TEMP/banner.svg"
          cat "$RUNNER_TEMP/banner.svg"
      - name: Publish to the readme-banner branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current.svg"
          if gh api "repos/${REPO}/contents/banner.svg?ref=readme-banner" \
               -H "Accept: application/vnd.github.raw" > "$current" 2>/dev/null \
             && cmp -s "$current" "$RUNNER_TEMP/banner.svg"; then
            echo "Banner unchanged."
            exit 0
          fi
          dir="$RUNNER_TEMP/readme-banner"
          git init -q -b readme-banner "$dir"
          cp "$RUNNER_TEMP/banner.svg" "$dir/banner.svg"
          printf '%s\n' \
            "Generated by .github/workflows/dev-banner.yml on every release; embedded by the README on main." \
            "Force-pushed each time: don't commit here." > "$dir/README.md"
          git -C "$dir" add banner.svg README.md
          git -C "$dir" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dev banner for the current releases"
          gh auth setup-git
          git -C "$dir" push --force "https://github.com/${REPO}.git" readme-banner
    name: compiler-shadow / banner
    continue-on-error: true
