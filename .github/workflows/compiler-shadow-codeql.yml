# Generated by compiler.dev benchmark mode. Runs eligible jobs a second time on
# compiler.dev runners for comparison only: continue-on-error, read-only, never gates merges.
# Remove this file to stop the benchmark.
name: compiler-shadow / CodeQL
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: compiler-shadow-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  analyze:
    name: compiler-shadow / Analyze ${{ matrix.language }}
    runs-on: ["self-hosted", "compiler-ci"]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The app, and the workflows themselves.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
    continue-on-error: true
