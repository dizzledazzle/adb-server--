# Generated by compiler.dev benchmark mode. Runs eligible jobs a second time on
# compiler.dev runners for comparison only: continue-on-error, read-only, never gates merges.
# Remove this file to stop the benchmark.
name: compiler-shadow / Security scan
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: compiler-shadow-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  python:
    name: compiler-shadow / Audit Python dependencies
    runs-on: ["self-hosted", "compiler-ci"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pip-audit on the default branch's lockfiles
        run: |
          set -euo pipefail
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          # The dev lockfile holds every package the app image installs, plus pytest.
          /tmp/audit/bin/pip-audit --requirement requirements-dev.txt --require-hashes --strict
    continue-on-error: true
