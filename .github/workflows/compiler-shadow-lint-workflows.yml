# Generated by compiler.dev benchmark mode. Runs eligible jobs a second time on
# compiler.dev runners for comparison only: continue-on-error, read-only, never gates merges.
# Remove this file to stop the benchmark.
name: compiler-shadow / Lint workflows
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: compiler-shadow-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  actionlint:
    runs-on: ["self-hosted", "compiler-ci"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        env:
          # Bumped by hand; checksum copied from the release's own
          # actionlint_<version>_checksums.txt, so a substituted binary is refused.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        # actionlint shells out to shellcheck for `run:` blocks and silently
        # skips that pass when shellcheck is not installed. The GitHub runner
        # has it; install shellcheck before trusting a local actionlint run.
        run: ./actionlint -color
    name: compiler-shadow / actionlint
    continue-on-error: true
